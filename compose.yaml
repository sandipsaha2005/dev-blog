services:
  db:
    image: postgres:16
    container_name: devblog_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sandip
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: devblog
    ports:
      - "5432:5432"
    volumes:
      - devblog_data:/var/lib/postgresql/data


volumes:
  devblog_data: